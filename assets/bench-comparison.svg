<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Theme: dark backdrop so it pops on both light and dark GitHub READMEs -->
  <defs>
    <style>
      .title       { font-size: 22px; font-weight: 700; fill: #f3f4f6; }
      .subtitle    { font-size: 13px; fill: #9ca3af; }
      .scenario    { font-size: 14px; font-weight: 600; fill: #e5e7eb; }
      .scenarioSub { font-size: 11px; fill: #9ca3af; }
      .barLabel    { font-size: 12px; font-weight: 600; fill: #ffffff; }
      .speedup     { font-size: 16px; font-weight: 700; fill: #10b981; }
      .speedupRev  { font-size: 16px; font-weight: 700; fill: #f97316; }
      .legend      { font-size: 12px; fill: #d1d5db; }
      .footnote    { font-size: 11px; fill: #6b7280; }
    </style>
  </defs>

  <!-- background -->
  <rect width="880" height="540" fill="#0f172a" rx="8"/>

  <!-- title -->
  <text x="40" y="40" class="title">Pilates vs WASM Yoga — flex layout latency</text>
  <text x="40" y="60" class="subtitle">Mean time per layout pass · lower is better · Pilates beats WASM Yoga across every flex-layout workload, including every hot-relayout shape</text>

  <!-- legend -->
  <g transform="translate(620, 35)">
    <rect width="14" height="14" fill="#10b981" rx="2"/>
    <text x="22" y="11" class="legend">@pilates/core (pure TS)</text>
    <rect y="22" width="14" height="14" fill="#f97316" rx="2"/>
    <text x="22" y="33" class="legend">yoga-layout (WASM)</text>
  </g>

  <!-- chart area starts at y=100 -->
  <!-- Each row: 56 tall. Layout per row: scenario col (180px wide), bar area (520px), speedup col (right-aligned).
       Bar area: 4 cells wide and 2 stacked bars (Pilates 18 tall + 4 gap + Yoga 18 tall = 40).
       Bars are normalized within-row to the slower of the two, full bar width = 480px. -->

  <!-- ROW 1: tiny -->
  <g transform="translate(0, 100)">
    <text x="40" y="14" class="scenario">tiny</text>
    <text x="40" y="30" class="scenarioSub">10 nodes, 1 level</text>
    <!-- Pilates 2.9µs / Yoga 15.4µs (5×). Pilates bar = 2.9/15.4 * 480 = 90 -->
    <rect x="220" y="2" width="90" height="18" fill="#10b981" rx="2"/>
    <text x="316" y="15" class="barLabel" fill="#10b981">2.9µs</text>
    <rect x="220" y="26" width="480" height="18" fill="#f97316" rx="2"/>
    <text x="708" y="39" class="barLabel" fill="#f97316">15.4µs</text>
    <text x="780" y="28" class="speedup">5× faster</text>
  </g>

  <!-- ROW 2: realistic -->
  <g transform="translate(0, 156)">
    <text x="40" y="14" class="scenario">realistic</text>
    <text x="40" y="30" class="scenarioSub">~100 nodes, 3-4 levels</text>
    <!-- Pilates 32µs / Yoga 268µs (8×). Pilates bar = 32/268 * 480 = 57 -->
    <rect x="220" y="2" width="57" height="18" fill="#10b981" rx="2"/>
    <text x="283" y="15" class="barLabel" fill="#10b981">32µs</text>
    <rect x="220" y="26" width="480" height="18" fill="#f97316" rx="2"/>
    <text x="708" y="39" class="barLabel" fill="#f97316">268µs</text>
    <text x="780" y="28" class="speedup">8× faster</text>
  </g>

  <!-- ROW 3: stress -->
  <g transform="translate(0, 212)">
    <text x="40" y="14" class="scenario">stress</text>
    <text x="40" y="30" class="scenarioSub">~1,000 nodes, 2 levels</text>
    <!-- Pilates 181µs / Yoga 1.56ms (9×). Pilates bar = 181/1560 * 480 = 56 -->
    <rect x="220" y="2" width="56" height="18" fill="#10b981" rx="2"/>
    <text x="282" y="15" class="barLabel" fill="#10b981">181µs</text>
    <rect x="220" y="26" width="480" height="18" fill="#f97316" rx="2"/>
    <text x="708" y="39" class="barLabel" fill="#f97316">1.56ms</text>
    <text x="780" y="28" class="speedup">9× faster</text>
  </g>

  <!-- ROW 4: big -->
  <g transform="translate(0, 268)">
    <text x="40" y="14" class="scenario">big</text>
    <text x="40" y="30" class="scenarioSub">~5,000 nodes</text>
    <!-- Pilates 1.05ms / Yoga 7.39ms (7×). Pilates bar = 1050/7390 * 480 = 68 -->
    <rect x="220" y="2" width="68" height="18" fill="#10b981" rx="2"/>
    <text x="294" y="15" class="barLabel" fill="#10b981">1.05ms</text>
    <rect x="220" y="26" width="480" height="18" fill="#f97316" rx="2"/>
    <text x="708" y="39" class="barLabel" fill="#f97316">7.39ms</text>
    <text x="780" y="28" class="speedup">7× faster</text>
  </g>

  <!-- ROW 5: huge -->
  <g transform="translate(0, 324)">
    <text x="40" y="14" class="scenario">huge</text>
    <text x="40" y="30" class="scenarioSub">~10,000 nodes</text>
    <!-- Pilates 2.40ms / Yoga 15.3ms (6×). Pilates bar = 2400/15300 * 480 = 75 -->
    <rect x="220" y="2" width="75" height="18" fill="#10b981" rx="2"/>
    <text x="301" y="15" class="barLabel" fill="#10b981">2.40ms</text>
    <rect x="220" y="26" width="480" height="18" fill="#f97316" rx="2"/>
    <text x="708" y="39" class="barLabel" fill="#f97316">15.3ms</text>
    <text x="780" y="28" class="speedup">6× faster</text>
  </g>

  <!-- ROW 6: hot-relayout (no boundaries — Pilates wins for the first time) -->
  <g transform="translate(0, 380)">
    <text x="40" y="14" class="scenario">hot-relayout</text>
    <text x="40" y="30" class="scenarioSub">1k tree, mutate one leaf / frame</text>
    <!-- Pilates 19.1µs / Yoga 57.9µs (3×). Pilates bar = 19.1/57.9 * 480 = 158 -->
    <rect x="220" y="2" width="158" height="18" fill="#10b981" rx="2"/>
    <text x="384" y="15" class="barLabel" fill="#10b981">19.1µs</text>
    <rect x="220" y="26" width="480" height="18" fill="#f97316" rx="2"/>
    <text x="708" y="39" class="barLabel" fill="#f97316">57.9µs</text>
    <text x="780" y="28" class="speedup">3× faster</text>
  </g>

  <!-- ROW 7: hot-relayout + boundaries (the win generalises) -->
  <g transform="translate(0, 436)">
    <!-- accent: highlight the headline row with a subtle background -->
    <rect x="20" y="-6" width="840" height="56" fill="#1e293b" rx="6"/>
    <text x="40" y="14" class="scenario">hot-relayout</text>
    <text x="40" y="30" class="scenarioSub">↑ same workload, with explicit-sized boundaries</text>
    <!-- Pilates 18.5µs / Yoga 51.5µs (3×). Pilates bar = 18.5/51.5 * 480 = 172 -->
    <rect x="220" y="2" width="172" height="18" fill="#10b981" rx="2"/>
    <text x="398" y="15" class="barLabel" fill="#10b981">18.5µs</text>
    <rect x="220" y="26" width="480" height="18" fill="#f97316" rx="2"/>
    <text x="708" y="39" class="barLabel" fill="#f97316">51.5µs</text>
    <text x="780" y="28" class="speedup">3× faster</text>
  </g>

  <!-- footer -->
  <text x="40" y="510" class="footnote">Reproduce: <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#9ca3af">pnpm bench</tspan> in github.com/pilatesjs/pilates · Node 26, darwin/arm64 · machine numbers vary; relative positions are the signal</text>
  <text x="40" y="525" class="footnote">Spineless incremental engine (phases 8–12) wins every hot-relayout shape, with or without explicit-sized containers — the workloads Yoga used to win</text>
</svg>
