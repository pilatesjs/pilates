<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Theme: dark backdrop so it pops on both light and dark GitHub READMEs -->
  <defs>
    <style>
      .title       { font-size: 22px; font-weight: 700; fill: #f3f4f6; }
      .subtitle    { font-size: 13px; fill: #9ca3af; }
      .scenario    { font-size: 14px; font-weight: 600; fill: #e5e7eb; }
      .scenarioSub { font-size: 11px; fill: #9ca3af; }
      .barLabel    { font-size: 12px; font-weight: 600; fill: #ffffff; }
      .speedup     { font-size: 16px; font-weight: 700; fill: #10b981; }
      .speedupRev  { font-size: 16px; font-weight: 700; fill: #f97316; }
      .legend      { font-size: 12px; fill: #d1d5db; }
      .footnote    { font-size: 11px; fill: #6b7280; }
    </style>
  </defs>

  <!-- background -->
  <rect width="880" height="660" fill="#0f172a" rx="8"/>

  <!-- title -->
  <text x="40" y="40" class="title">Pilates vs WASM Yoga — flex layout latency</text>
  <text x="40" y="60" class="subtitle">Median time per layout pass · lower is better · @pilates/core 2.0.1 vs yoga-layout 3.x · 9 scenarios in our bench suite</text>

  <!-- legend -->
  <g transform="translate(620, 35)">
    <rect width="14" height="14" fill="#10b981" rx="2"/>
    <text x="22" y="11" class="legend">@pilates/core (pure TS)</text>
    <rect y="22" width="14" height="14" fill="#f97316" rx="2"/>
    <text x="22" y="33" class="legend">yoga-layout (WASM)</text>
  </g>

  <!-- chart area starts at y=100 -->
  <!-- Bar area: full width = 480px, normalized within-row to Yoga's bar. -->

  <!-- ROW 1: tiny -->
  <g transform="translate(0, 100)">
    <text x="40" y="14" class="scenario">tiny</text>
    <text x="40" y="30" class="scenarioSub">10 nodes, 1 level</text>
    <!-- Pilates 4.5µs / Yoga 19.0µs (4.2×). Pilates bar = 4.5/19.0 * 480 = 114 -->
    <rect x="220" y="2" width="114" height="18" fill="#10b981" rx="2"/>
    <text x="340" y="15" class="barLabel" fill="#10b981">4.5µs</text>
    <rect x="220" y="26" width="480" height="18" fill="#f97316" rx="2"/>
    <text x="708" y="39" class="barLabel" fill="#f97316">19.0µs</text>
    <text x="780" y="28" class="speedup">4.2× faster</text>
  </g>

  <!-- ROW 2: realistic -->
  <g transform="translate(0, 156)">
    <text x="40" y="14" class="scenario">realistic</text>
    <text x="40" y="30" class="scenarioSub">~100 nodes, 3-4 levels</text>
    <!-- Pilates 121µs / Yoga 328µs (2.7×). Pilates bar = 121/328 * 480 = 177 -->
    <rect x="220" y="2" width="177" height="18" fill="#10b981" rx="2"/>
    <text x="403" y="15" class="barLabel" fill="#10b981">121µs</text>
    <rect x="220" y="26" width="480" height="18" fill="#f97316" rx="2"/>
    <text x="708" y="39" class="barLabel" fill="#f97316">328µs</text>
    <text x="780" y="28" class="speedup">2.7× faster</text>
  </g>

  <!-- ROW 3: stress -->
  <g transform="translate(0, 212)">
    <text x="40" y="14" class="scenario">stress</text>
    <text x="40" y="30" class="scenarioSub">~1,000 nodes, 2 levels</text>
    <!-- Pilates 601µs / Yoga 1.94ms (3.2×). Pilates bar = 601/1940 * 480 = 149 -->
    <rect x="220" y="2" width="149" height="18" fill="#10b981" rx="2"/>
    <text x="375" y="15" class="barLabel" fill="#10b981">601µs</text>
    <rect x="220" y="26" width="480" height="18" fill="#f97316" rx="2"/>
    <text x="708" y="39" class="barLabel" fill="#f97316">1.94ms</text>
    <text x="780" y="28" class="speedup">3.2× faster</text>
  </g>

  <!-- ROW 4: big -->
  <g transform="translate(0, 268)">
    <text x="40" y="14" class="scenario">big</text>
    <text x="40" y="30" class="scenarioSub">~5,000 nodes</text>
    <!-- Pilates 3.32ms / Yoga 9.17ms (2.8×). Pilates bar = 3320/9170 * 480 = 174 -->
    <rect x="220" y="2" width="174" height="18" fill="#10b981" rx="2"/>
    <text x="400" y="15" class="barLabel" fill="#10b981">3.32ms</text>
    <rect x="220" y="26" width="480" height="18" fill="#f97316" rx="2"/>
    <text x="708" y="39" class="barLabel" fill="#f97316">9.17ms</text>
    <text x="780" y="28" class="speedup">2.8× faster</text>
  </g>

  <!-- ROW 5: huge -->
  <g transform="translate(0, 324)">
    <text x="40" y="14" class="scenario">huge</text>
    <text x="40" y="30" class="scenarioSub">~10,000 nodes</text>
    <!-- Pilates 8.62ms / Yoga 18.5ms (2.1×). Pilates bar = 8620/18500 * 480 = 224 -->
    <rect x="220" y="2" width="224" height="18" fill="#10b981" rx="2"/>
    <text x="450" y="15" class="barLabel" fill="#10b981">8.62ms</text>
    <rect x="220" y="26" width="480" height="18" fill="#f97316" rx="2"/>
    <text x="708" y="39" class="barLabel" fill="#f97316">18.5ms</text>
    <text x="780" y="28" class="speedup">2.1× faster</text>
  </g>

  <!-- ROW 6: hot-relayout (no boundaries) -->
  <g transform="translate(0, 380)">
    <text x="40" y="14" class="scenario">hot-relayout</text>
    <text x="40" y="30" class="scenarioSub">1k tree, mutate one leaf / frame</text>
    <!-- Pilates 16.3µs / Yoga 83.0µs (5.1×). Pilates bar = 16.3/83.0 * 480 = 94 -->
    <rect x="220" y="2" width="94" height="18" fill="#10b981" rx="2"/>
    <text x="320" y="15" class="barLabel" fill="#10b981">16.3µs</text>
    <rect x="220" y="26" width="480" height="18" fill="#f97316" rx="2"/>
    <text x="708" y="39" class="barLabel" fill="#f97316">83.0µs</text>
    <text x="780" y="28" class="speedup">5.1× faster</text>
  </g>

  <!-- ROW 7: hot-relayout + boundaries -->
  <g transform="translate(0, 436)">
    <text x="40" y="14" class="scenario">hot-relayout</text>
    <text x="40" y="30" class="scenarioSub">↑ same workload, with explicit-sized boundaries</text>
    <!-- Pilates 15.8µs / Yoga 77.8µs (4.9×). Pilates bar = 15.8/77.8 * 480 = 97 -->
    <rect x="220" y="2" width="97" height="18" fill="#10b981" rx="2"/>
    <text x="323" y="15" class="barLabel" fill="#10b981">15.8µs</text>
    <rect x="220" y="26" width="480" height="18" fill="#f97316" rx="2"/>
    <text x="708" y="39" class="barLabel" fill="#f97316">77.8µs</text>
    <text x="780" y="28" class="speedup">4.9× faster</text>
  </g>

  <!-- ROW 8: hot-relayout (text mutation) -->
  <g transform="translate(0, 492)">
    <text x="40" y="14" class="scenario">hot-relayout</text>
    <text x="40" y="30" class="scenarioSub">↑ same, fixed-size table, text mutation</text>
    <!-- Pilates 8.9µs / Yoga 90.6µs (10×). Pilates bar = 8.9/90.6 * 480 = 47 -->
    <rect x="220" y="2" width="47" height="18" fill="#10b981" rx="2"/>
    <text x="273" y="15" class="barLabel" fill="#10b981">8.9µs</text>
    <rect x="220" y="26" width="480" height="18" fill="#f97316" rx="2"/>
    <text x="708" y="39" class="barLabel" fill="#f97316">90.6µs</text>
    <text x="780" y="28" class="speedup">10× faster</text>
  </g>

  <!-- ROW 9: hot-structural (the gap that closed in phases 15-17) -->
  <g transform="translate(0, 548)">
    <!-- accent: highlight this row — it's the workload Yoga led on until last week -->
    <rect x="20" y="-6" width="840" height="56" fill="#1e293b" rx="6"/>
    <text x="40" y="14" class="scenario">hot-structural</text>
    <text x="40" y="30" class="scenarioSub">append + remove a row / frame · Yoga led on this until phases 15-17</text>
    <!-- Pilates 71.3µs / Yoga 118.3µs (1.7×). Pilates bar = 71.3/118.3 * 480 = 289 -->
    <rect x="220" y="2" width="289" height="18" fill="#10b981" rx="2"/>
    <text x="515" y="15" class="barLabel" fill="#10b981">71.3µs</text>
    <rect x="220" y="26" width="480" height="18" fill="#f97316" rx="2"/>
    <text x="708" y="39" class="barLabel" fill="#f97316">118.3µs</text>
    <text x="780" y="28" class="speedup">1.7× faster</text>
  </g>

  <!-- footer -->
  <text x="40" y="630" class="footnote">Reproduce: <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#9ca3af">pnpm bench</tspan> in github.com/pilatesjs/pilates · Node 22, win32-x64 · median over a ~5s tinybench window · machine numbers vary; relative positions are the signal</text>
  <text x="40" y="645" class="footnote">A 9-scenario hand-picked suite, not a universal claim · adversarial benchmarks welcome</text>
</svg>
